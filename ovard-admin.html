<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16843a">
<title>OVARD — Админ панель</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f6f3;
 color:#202923;
}
header{
 background:#16843a;
 color:white;
 padding:20px;
}
header h2{margin:0;font-size:23px}
header p{margin:7px 0 0;font-size:13px}
main{padding:15px;max-width:650px;margin:auto}
.card{
 background:white;
 padding:17px;
 border-radius:16px;
 margin-bottom:15px;
 box-shadow:0 3px 12px #00000008;
}
h3{margin:0 0 15px;font-size:17px}
input,textarea,select{
 width:100%;
 padding:13px;
 border:1px solid #dce4dc;
 border-radius:10px;
 margin:6px 0 12px;
 font-size:15px;
 background:white;
}
textarea{min-height:75px;resize:vertical}
button{
 border:0;
 padding:12px 16px;
 border-radius:10px;
 font-size:14px;
 font-weight:bold;
 cursor:pointer;
}
.primary{background:#16843a;color:white;width:100%}
.secondary{background:#e9f4ec;color:#16843a}
.danger{background:#ffeded;color:#d32f2f}
.item{
 border:1px solid #e6ebe6;
 border-radius:12px;
 padding:12px;
 margin:10px 0;
}
.item img{
 width:65px;height:65px;
 object-fit:cover;border-radius:9px;
}
.item-title{font-weight:bold}
.muted{color:#7b857e;font-size:13px}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.actions button{flex:1}
.tabs{
 display:flex;gap:8px;margin-bottom:15px;
}
.tabs button{flex:1;background:#e6eee7;color:#245b35}
.tabs button.active{background:#16843a;color:white}
.hidden{display:none}
.status{font-size:12px;color:#16843a}
</style>
</head>

<body>

<header>
 <h2>OVARD <span style="font-size:13px">ADMIN</span></h2>
 <p>Управление магазином и товарами</p>
</header>

<main>

<div class="tabs">
 <button class="active" onclick="showTab('shops',this)">Магазины</button>
 <button onclick="showTab('products',this)">Товары OVARD</button>
</div>

<section id="shops">

<div class="card">
 <h3 id="shopTitle">＋ Добавить магазин</h3>

 <input id="shopName" placeholder="Название магазина">
 <input id="shopImage" placeholder="Ссылка на фото магазина">
 <textarea id="shopDesc" placeholder="Описание магазина"></textarea>

 <button class="primary" onclick="saveShop()">Сохранить магазин</button>
 <button class="secondary hidden" id="cancelShop" onclick="resetShop()">Отмена</button>
</div>

<div class="card">
 <h3>Все магазины</h3>
 <div id="shopList"></div>
</div>

</section>


<section id="products" class="hidden">

<div class="card">
 <h3 id="productTitle">＋ Добавить товар OVARD</h3>

 <input id="productName" placeholder="Название товара">
 <input id="productImage" placeholder="Ссылка на фото товара">

 <input id="productPrice" type="number" min="0" placeholder="Цена">

 <input id="productUnit" list="units" placeholder="Единица измерения">

 <datalist id="units">
  <option value="кг">
  <option value="грамм">
  <option value="тонна">
  <option value="шт">
  <option value="упаковка">
  <option value="мешок">
  <option value="литр">
  <option value="метр">
  <option value="ящик">
  <option value="день">
  <option value="сезон">
 </datalist>

 <textarea id="productDesc" placeholder="Описание товара"></textarea>

 <button class="primary" onclick="saveProduct()">Сохранить товар</button>
 <button class="secondary hidden" id="cancelProduct" onclick="resetProduct()">Отмена</button>
</div>

<div class="card">
 <h3>Товары OVARD</h3>
 <div id="productList"></div>
</div>

</section>

<div class="card">
 <h3>Хранение данных</h3>
 <p class="muted">Данные сохраняются в памяти браузера этого устройства.</p>
 <p class="status">● Локальное хранилище активно</p>
</div>

</main>

<script>

let shops = JSON.parse(localStorage.getItem("ovard_shops") || "[]");
let products = JSON.parse(localStorage.getItem("ovard_products") || "[]");

let editingShop = -1;
let editingProduct = -1;

function saveData(){
 localStorage.setItem("ovard_shops",JSON.stringify(shops));
 localStorage.setItem("ovard_products",JSON.stringify(products));
}

function showTab(tab,btn){
 document.getElementById("shops").classList.toggle("hidden",tab!=="shops");
 document.getElementById("products").classList.toggle("hidden",tab!=="products");
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
}

function resetShop(){
 editingShop=-1;
 shopName.value="";
 shopImage.value="";
 shopDesc.value="";
 shopTitle.textContent="＋ Добавить магазин";
 cancelShop.classList.add("hidden");
}

function saveShop(){
 let name=shopName.value.trim();
 if(!name){alert("Введите название магазина");return;}

 let data={
  name:name,
  image:shopImage.value.trim(),
  description:shopDesc.value.trim(),
  active:editingShop>=0 ? shops[editingShop].active : true,
  products:editingShop>=0 ? (shops[editingShop].products||[]) : []
 };

 if(editingShop>=0){
  shops[editingShop]=data;
 }else{
  shops.push(data);
 }

 saveData();
 resetShop();
 renderShops();
 alert("Магазин сохранён");
}

function renderShops(){
 shopList.innerHTML="";

 if(!shops.length){
  shopList.innerHTML='<p class="muted">Магазинов пока нет</p>';
  return;
 }

 shops.forEach((s,i)=>{
  shopList.innerHTML+=`
  <div class="item">
   <div style="display:flex;gap:12px;align-items:center">
    ${s.image?`<img src="${safe(s.image)}">`:""}
    <div>
     <div class="item-title">${safe(s.name)}</div>
     <div class="muted">${safe(s.description||"")}</div>
     <div class="status">${s.active?"● Активен":"● Выключен"}</div>
    </div>
   </div>
   <div class="actions">
    <button class="secondary" onclick="editShop(${i})">Изменить</button>
    <button class="secondary" onclick="toggleShop(${i})">${s.active?"Выключить":"Включить"}</button>
    <button class="danger" onclick="deleteShop(${i})">Удалить</button>
   </div>
  </div>`;
 });
}

function editShop(i){
 let s=shops[i];
 editingShop=i;
 shopName.value=s.name;
 shopImage.value=s.image||"";
 shopDesc.value=s.description||"";
 shopTitle.textContent="Изменить магазин";
 cancelShop.classList.remove("hidden");
 window.scrollTo(0,0);
}

function toggleShop(i){
 shops[i].active=!shops[i].active;
 saveData();
 renderShops();
}

function deleteShop(i){
 if(confirm("Удалить этот магазин?")){
  shops.splice(i,1);
  saveData();
  renderShops();
 }
}

function resetProduct(){
 editingProduct=-1;
 productName.value="";
 productImage.value="";
 productPrice.value="";
 productUnit.value="";
 productDesc.value="";
 productTitle.textContent="＋ Добавить товар OVARD";
 cancelProduct.classList.add("hidden");
}

function saveProduct(){
 let name=productName.value.trim();
 let price=productPrice.value;
 let unit=productUnit.value.trim();

 if(!name){alert("Введите название товара");return;}
 if(price==="" || Number(price)<0){alert("Введите правильную цену");return;}
 if(!unit){alert("Укажите единицу измерения");return;}

 let data={
  name:name,
  image:productImage.value.trim(),
  price:Number(price),
  unit:unit,
  description:productDesc.value.trim()
 };

 if(editingProduct>=0){
  products[editingProduct]=data;
 }else{
  products.push(data);
 }

 saveData();
 resetProduct();
 renderProducts();
 alert("Товар сохранён");
}

function renderProducts(){
 productList.innerHTML="";

 if(!products.length){
  productList.innerHTML='<p class="muted">Товаров пока нет</p>';
  return;
 }

 products.forEach((p,i)=>{
  productList.innerHTML+=`
  <div class="item">
   <div style="display:flex;gap:12px;align-items:center">
    ${p.image?`<img src="${safe(p.image)}">`:""}
    <div>
     <div class="item-title">${safe(p.name)}</div>
     <div style="color:#16843a;font-weight:bold">${p.price} сомони / ${safe(p.unit)}</div>
     <div class="muted">${safe(p.description||"")}</div>
    </div>
   </div>
   <div class="actions">
    <button class="secondary" onclick="editProduct(${i})">Изменить</button>
    <button class="danger" onclick="deleteProduct(${i})">Удалить</button>
   </div>
  </div>`;
 });
}

function editProduct(i){
 let p=products[i];
 editingProduct=i;
 productName.value=p.name;
 productImage.value=p.image||"";
 productPrice.value=p.price;
 productUnit.value=p.unit;
 productDesc.value=p.description||"";
 productTitle.textContent="Изменить товар";
 cancelProduct.classList.remove("hidden");
 window.scrollTo(0,0);
}

function deleteProduct(i){
 if(confirm("Удалить этот товар?")){
  products.splice(i,1);
  saveData();
  renderProducts();
 }
}

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

renderShops();
renderProducts();

</script>
</body>
</html>
