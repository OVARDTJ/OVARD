<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVARD - Админ панель</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Top Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <span>OVARD Admin</span>
      </div>
      <a href="index.html" class="cart-btn" style="text-decoration:none; text-align:center;">На сайт ➔</a>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="container">
    <section class="section active" style="display: block;">
      <h2>Управление магазинами и товарами</h2>
      
      <!-- Add Store Form -->
      <div class="card-form" style="margin-top: 15px;">
        <h3>Добавить новый магазин</h3>
        <input type="text" id="admin-store-name" placeholder="Название магазина">
        <input type="text" id="admin-store-desc" placeholder="Описание (например, Продукты, Одежда)">
        <button onclick="adminAddStore()">Добавить магазин</button>
      </div>

      <!-- Add Product Form -->
      <div class="card-form">
        <h3>Добавить товар</h3>
        <select id="admin-prod-store-select">
          <!-- Dynamic Store Options -->
        </select>
        <input type="text" id="admin-prod-name" placeholder="Название товара">
        <input type="number" id="admin-prod-price" placeholder="Цена (сомони)">
        
        <label for="admin-prod-unit">Единица измерения:</label>
        <select id="admin-prod-unit">
          <option value="шт">шт (дона)</option>
          <option value="кг">кг (килограмм)</option>
          <option value="мешок">мешок (халта)</option>
          <option value="сотих">сотих (земля)</option>
          <option value="гектар">гектар (земля)</option>
          <option value="тонна">тонна (корма/зерно)</option>
          <option value="прес">прес/баст (сено)</option>
        </select>
        
        <button onclick="adminAddProduct()">Добавить товар</button>
      </div>
    </section>
  </main>

  <script>
    // Simple admin script handling local storage / sync with script.js
    function adminAddStore() {
      const name = document.getElementById('admin-store-name').value;
      const desc = document.getElementById('admin-store-desc').value;
      if(!name) return alert("Введите название магазина");

      let stores = JSON.parse(localStorage.getItem('ovard_stores')) || [
        { id: 1, name: "Магазин OVARD", desc: "Главный склад продуктов и товаров" },
        { id: 2, name: "Ферма & Сельхоз", desc: "Замин, алаф, корма ва чорво" }
      ];

      stores.push({ id: Date.now(), name, desc });
      localStorage.setItem('ovard_stores', JSON.stringify(stores));
      
      document.getElementById('admin-store-name').value = '';
      document.getElementById('admin-store-desc').value = '';
      alert("Магазин успешно добавлен!");
      loadStoresSelect();
    }

    function adminAddProduct() {
      const storeId = Number(document.getElementById('admin-prod-store-select').value);
      const name = document.getElementById('admin-prod-name').value;
      const price = Number(document.getElementById('admin-prod-price').value);
      const unit = document.getElementById('admin-prod-unit').value;

      if(!name || !price) return alert("Заполните все поля");

      let products = JSON.parse(localStorage.getItem('ovard_products')) || [
        { id: 101, storeId: 1, name: "Мука 50кг", price: 280, unit: "мешок" },
        { id: 102, storeId: 1, name: "Сахар", price: 10, unit: "кг" },
        { id: 103, storeId: 2, name: "Алаф (Люцерна)", price: 25, unit: "прес" },
        { id: 104, storeId: 2, name: "Замини кишоварзӣ", price: 1500, unit: "сотих" }
      ];

      products.push({ id: Date.now(), storeId, name, price, unit });
      localStorage.setItem('ovard_products', JSON.stringify(products));

      document.getElementById('admin-prod-name').value = '';
      document.getElementById('admin-prod-price').value = '';
      alert("Товар успешно добавлен!");
    }

    function loadStoresSelect() {
      let stores = JSON.parse(localStorage.getItem('ovard_stores')) || [
        { id: 1, name: "Магазин OVARD", desc: "Главный склад продуктов и товаров" },
        { id: 2, name: "Ферма & Сельхоз", desc: "Замин, алаф, корма ва чорво" }
      ];
      const select = document.getElementById('admin-prod-store-select');
      select.innerHTML = '';
      stores.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.innerText = s.name;
        select.appendChild(opt);
      });
    }

    loadStoresSelect();
  </script>
</body>
</html>
