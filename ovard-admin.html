<!DOCTYPE html>
<html lang="tj">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OVARD - Панель администратора</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-layout { display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #033a18; color: white; padding: 16px; }
    .sidebar .logo { font-size: 22px; font-weight: bold; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .sidebar ul { list-style: none; }
    .sidebar li { padding: 12px; margin-bottom: 6px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
    .sidebar li.active { background: #0d8a43; font-weight: bold; }
    .main-admin { flex: 1; padding: 20px; background: #f4f6f8; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .btn-add { background: #0d8a43; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .admin-store-card { background: white; padding: 12px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .admin-store-info { display: flex; align-items: center; gap: 12px; }
    .admin-store-info img { width: 45px; height: 45px; border-radius: 8px; object-fit: cover; }
    .actions { display: flex; gap: 10px; align-items: center; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 22px; }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
    input:checked + .slider { background-color: #0d8a43; }
    input:checked + .slider:before { transform: translateX(18px); }
    .btn-icon { background: #f0f0f0; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: #555; }
    .btn-icon.delete { color: #d9534f; }
    .footer-quote { margin-top: 30px; background: #e6f4ea; padding: 12px; border-radius: 8px; text-align: center; color: #0d8a43; font-size: 13px; }
  </style>
</head>
<body>

  <div class="admin-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="logo"><i class="fa-solid fa-circle-check"></i> Ovard</div>
      <p style="font-size:12px; opacity:0.7; margin-bottom:15px;">Панель администратора</p>
      <ul>
        <li class="active"><i class="fa-solid fa-store"></i> Магазины</li>
        <li><i class="fa-solid fa-box"></i> Товары</li>
        <li><i class="fa-solid fa-receipt"></i> Заказы</li>
        <li><i class="fa-solid fa-gear"></i> Настройки</li>
        <li><a href="index.html" style="color:white; text-decoration:none;"><i class="fa-solid fa-right-from-bracket"></i> Выход</a></li>
      </ul>

      <div class="footer-quote">
        <i class="fa-solid fa-leaf"></i> OVARD – развитие и удобство для вас!
      </div>
    </div>

    <!-- Content -->
    <div class="main-admin">
      <div class="admin-header">
        <h2>Управление магазинами</h2>
        <button class="btn-add"><i class="fa-solid fa-plus"></i> Добавить магазин</button>
      </div>

      <div class="admin-store-card">
        <div class="admin-store-info">
          <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=100" alt="Bread">
          <div>
            <h4>Нонвойхона</h4>
            <small style="color:#777;">Фархор</small>
          </div>
        </div>
        <div class="actions">
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          <button class="btn-icon"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>

      <div class="admin-store-card">
        <div class="admin-store-info">
          <img src="https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=100" alt="Products">
          <div>
            <h4>Продукты</h4>
            <small style="color:#777;">Фархор</small>
          </div>
        </div>
        <div class="actions">
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          <button class="btn-icon"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>

      <div class="admin-store-card">
        <div class="admin-store-info">
          <img src="https://images.unsplash.com/photo-1607623814075-e51df1bdc82f?w=100" alt="Meat">
          <div>
            <h4>Мясо и птица</h4>
            <small style="color:#777;">Фархор</small>
          </div>
        </div>
        <div class="actions">
          <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
          <button class="btn-icon"><i class="fa-solid fa-pen"></i></button>
          <button class="btn-icon delete"><i class="fa-solid fa-trash"></i></button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
