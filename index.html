    <select id="farkhor-village" onchange="updateLocation(this.value)">

            <option value="деҳ. Бобосафоли Поён">деҳ. Бобосафоли Поён</option>
            <option value="деҳ. Бобосафоли Боло">деҳ. Бобосафоли Боло</option>
            <option value="деҳ. Душанбе">деҳ. Душанбе</option>
            <option value="ҷ. Ватан (Садоқат/Қизилсу)">ҷ. Ватан</option>
            <option value="деҳ. Лағмон">деҳ. Лағмон</option>
            <option value="деҳ. Баҳористон">деҳ. Баҳористон</option>
            <option value="деҳ. Куҳандиёр (Уртабӯз)">деҳ. Куҳандиёр</option>
            <option value="ҷ. Ғайрат">ҷ. Ғайрат</option>
            <option value="деҳ. Сурхоб">деҳ. Сурхоб</option>
            <option value="деҳ. Хушоби Поён">деҳ. Хушоби Поён</option>
            <option value="деҳ. Хушоби Боло">деҳ. Хушоби Боло</option>
            <option value="ҷ. Гулистон">ҷ. Гулистон</option>
            <option value="деҳ. Деҳқонариқ">деҳ. Деҳқонариқ</option>
            <option value="ҷ. Зафар (Сомониён)">ҷ. Зафар</option>
            <option value="ҷ. Истиқлол (Ҷартеппа)">ҷ. Истиқлол</option>
        </optgroup>
    </select>
</div>
