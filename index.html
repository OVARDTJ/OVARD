<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ovard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Истифодаи иконкаҳо аз FontAwesome барои дақиқ баромадан -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Сарлавҳа -->
        <header class="header">
            <div class="logo-area">
                <div class="logo-icon"><i class="fa-solid fa-check"></i></div>
                <span class="logo-text">Ovard</span>
            </div>
            <div class="header-actions">
                <div class="icon-btn notification">
                    <i class="fa-regular fa-bell"></i>
                    <span class="badge">1</span>
                </div>
                <div class="icon-btn"><i class="fa-solid fa-gear"></i></div>
                <div class="icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></div>
            </div>
        </header>

        <!-- Баннер -->
        <div class="promo-banner">
            <div class="banner-text">
                <h1>Покупайте быстро и удобно!</h1>
                <p>Доставка по Фархору и всему региону</p>
                <button class="banner-btn">Перейти в магазины <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="banner-image">
                <div class="cart-illustration">🛒</div>
            </div>
            <div class="slider-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot active"></span>
            </div>
        </div>

        <!-- Сатри ҷустуҷӯ -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" placeholder="Поиск товаров и магазинов...">
        </div>

        <!-- Нишониҳои зуд (Quick Navigation Grid) -->
        <div class="quick-nav">
            <div class="quick-item">
                <div class="qi-icon green-bg"><i class="fa-solid fa-store"></i></div>
                <span>Магазины</span>
            </div>
            <div class="quick-item">
                <div class="qi-icon green-bg"><i class="fa-solid fa-truck"></i></div>
                <span>Доставка</span>
            </div>
            <div class="quick-item">
                <div class="qi-icon green-bg">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <span class="qi-badge">2</span>
                </div>
                <span>Корзина</span>
            </div>
            <div class="quick-item">
                <div class="qi-icon green-bg"><i class="fa-solid fa-user"></i></div>
                <span>Профиль</span>
            </div>
        </div>

        <!-- Корти кафолат -->
        <div class="secure-box">
            <div class="secure-left">
                <i class="fa-solid fa-shield-check"></i>
                <div>
                    <strong>Безопасные покупки</strong>
                    <p>и надёжные партнёры</p>
                </div>
            </div>
            <i class="fa-solid fa-chevron-right"></i>
        </div>
    </div>

    <!-- Панели поёнӣ (Bottom Navigation) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-link">
            <i class="fa-solid fa-store"></i>
            <span>Мағозаҳо</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fa-solid fa-truck-fast"></i>
            <span>Расонидан</span>
        </a>
        <a href="#" class="nav-link">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>Сабат</span>
        </a>
        <a href="#" class="nav-link active">
            <i class="fa-solid fa-user"></i>
            <span>Профил</span>
        </a>
    </nav>

</body>
</html>
