<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVARD - Доставка из магазинов</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background: #ffffff;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .logo {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-dark);
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            margin-top: 20px;
        }
        .categories {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        .cat-card {
            background: #ffffff;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            text-align: center;
            font-weight: 600;
            color: var(--text);
        }
        .store-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-panel {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px;
            margin-top: 30px;
            border: 2px dashed var(--primary);
        }
        .admin-panel input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }
        .btn:hover {
            background: var(--primary-dark);
        }
        .del-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">OVARD</div>
    <div style="font-size: 14px; color: #64748b;">📍 Душанбе / Фархор</div>
</header>

<div class="container">
    <div class="section-title">Основные категории / Категорияҳо</div>
    <div class="categories">
        <div class="cat-card">🌾 Озуқа ва Қанд</div>
        <div class="cat-card">💊 Дорухона</div>
        <div class="cat-card">👕 Либос ва Молу Калла</div>
        <div class="cat-card">🚜 Карбамид ва Силитра</div>
    </div>

    <div class="section-title">Магазины-партнеры / Мағозаҳои фаъол</div>
    <div id="storesList"></div>

    <div class="admin-panel">
        <h3 style="margin-top: 0; font-size: 15px; color: var(--primary-dark);">⚙️ Илова кардани мағозаи нав</h3>
        <input type="text" id="storeName" placeholder="Номи мағоза (масалан: Мағоза №1: Бозори Меваҳо)">
        <input type="text" id="storeDesc" placeholder="Маълумот (масалан: Озуқа, Тухми гандум)">
        <button class="btn" onclick="addNewStore()">Илова кардан ба сайт</button>
    </div>
</div>

<script>
    function getStores() {
        return JSON.parse(localStorage.getItem('ovard_main_stores')) || [
            { id: 1, name: "Магазин №1: Бозори Меваҳо", desc: "Озуқа ва маҳсулоти кишоварзӣ" },
            { id: 2, name: "Магазин №2: Либосҳои Кӯдакона", desc: "Либос ва ашёи пешбинӣ шуда" },
            { id: 3, name: "Мағозаи КХ Душанбе", desc: "Карбамид, силитра ва кунҷора" }
        ];
    }

    function saveStores(stores) {
        localStorage.setItem('ovard_main_stores', JSON.stringify(stores));
    }

    function renderStores() {
        const listDiv = document.getElementById('storesList');
        const stores = getStores();
        
        listDiv.innerHTML = '';
        stores.forEach(store => {
            listDiv.innerHTML += `
                <div class="store-card">
                    <div>
                        <h3 style="margin:0 0 4px 0; font-size:16px;">${store.name}</h3>
                        <p style="margin:0; color:#64748b; font-size:13px;">${store.desc}</p>
                        <button class="del-btn" onclick="deleteStore(${store.id})">Нест кардан</button>
                    </div>
                    <div style="background:#d1fae5; color:var(--primary-dark); padding:4px 10px; border-radius:20px; font-size:12px; font-weight:600;">Open</div>
                </div>
            `;
        });
    }

    function addNewStore() {
        const name = document.getElementById('storeName').value.trim();
        const desc = document.getElementById('storeDesc').value.trim();

        if (!name) {
            alert("Лутфан номи мағозаро нависед!");
            return;
        }

        const stores = getStores();
        stores.push({
            id: Date.now(),
            name: name,
            desc: desc || "Молу маҳсулоти босифат"
        });

        saveStores(stores);
        document.getElementById('storeName').value = '';
        document.getElementById('storeDesc').value = '';
        renderStores();
    }

    function deleteStore(id) {
        let stores = getStores();
        stores = stores.filter(s => s.id !== id);
        saveStores(stores);
        renderStores();
    }

    document.addEventListener('DOMContentLoaded', renderStores);
</script>

</body>
</html>
