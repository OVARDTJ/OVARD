<!DOCTYPE html>
<html lang="tg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мағозаи маҳсулот</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .header {
            background-color: #2e7d32;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .search-bar {
            padding: 10px;
            text-align: center;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .search-bar input {
            width: 80%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
        }
        .categories {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: white;
            margin-top: 10px;
        }
        .category-item {
            text-align: center;
            font-size: 14px;
        }
        .category-icon {
            width: 50px;
            height: 50px;
            background-color: #e8f5e9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 5px;
            color: #2e7d32;
            font-weight: bold;
        }
        .banner {
            background-color: #c8e6c9;
            margin: 15px;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .banner h2 {
            color: #1b5e20;
            margin: 0;
            font-size: 18px;
        }
        .products {
            padding: 15px;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        .product-card {
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .product-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }
        .price {
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Мағозаи Сабз 🌿</h2>
    </div>

    <div class="search-bar">
        <input type="text" placeholder="Ҷустуҷӯи маҳсулот...">
    </div>

    <div class="categories">
        <div class="category-item">
            <div class="category-icon">🍎</div>
            <span>Меваҳо</span>
        </div>
        <div class="category-item">
            <div class="category-icon">🥦</div>
            <span>Сабзавот</span>
        </div>
        <div class="category-item">
            <div class="category-icon">🥩</div>
            <span>Гӯшт</span>
        </div>
        <div class="category-item">
            <div class="category-icon">🥛</div>
            <span>Ширӣ</span>
        </div>
    </div>

    <div class="banner">
        <div>
            <h2>30% Тахфиф</h2>
            <p>Барои хариди аввалини шумо</p>
        </div>
    </div>

    <div class="products">
        <h3>Маҳсулоти маъмул</h3>
        <div class="product-grid">
            <div class="product-card">
                <p>🍓 Клубника</p>
                <div class="price">$4.99</div>
            </div>
            <div class="product-card">
                <p>🍌 Банан</p>
                <div class="price">$2.49</div>
            </div>
        </div>
    </div>

</body>
</html>
