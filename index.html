
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16843a">
  <meta name="description" content="Магазины, товары и доставка">
  <title>Главная</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<header class="topbar">
  <div class="logo">
    <span class="logo-mark">✓</span>
  </div>
  <div class="header-actions">
    <button id="searchOpen" aria-label="Поиск">⌕</button>
    <button id="notificationsOpen" aria-label="Уведомления">♧</button>
    <button id="settingsOpen" aria-label="Настройки">⋮</button>
  </div>
</header>

<main>
  <section id="homePage" class="page active">
    <div class="welcome">
      <h2>Добро пожаловать!</h2>
      <p>Выбирайте товары и оформляйте заказ</p>
    </div>

    <div id="searchBox" class="search-box hidden">
      <input id="searchInput" placeholder="Поиск товаров...">
    </div>

    <h3>Наши товары</h3>
    <div id="ownProducts" class="product-grid"></div>

    <section class="partners-section">
      <div class="section-title">
        <h3>Магазины</h3>
        <button id="allShopsButton">Все магазины →</button>
      </div>
      <div id="shopTicker" class="shop-ticker"></div>
    </section>
  </section>

  <section id="shopsPage" class="page">
    <h2>Магазины</h2>
    <div id="shopsList" class="shops-list"></div>
  </section>

  <section id="shopDetailPage" class="page">
    <button class="back-button" data-back>← Назад</button>
    <div id="shopDetail"></div>
    <div id="shopProducts" class="product-grid"></div>
  </section>

  <section id="cartPage" class="page">
    <h2>Корзина</h2>
    <div id="cartItems"></div>
    <div id="cartTotal"></div>
    <button id="checkoutButton" class="primary-button">Оформить заказ</button>
  </section>

  <section id="ordersPage" class="page">
    <h2>Мои заказы</h2>
    <div id="ordersList"></div>
  </section>

  <section id="messagesPage" class="page">
    <h2>Сообщения</h2>
    <div id="messagesList"></div>
  </section>

  <section id="profilePage" class="page">
    <h2>Мой аккаунт</h2>
    <div id="profileContent"></div>
  </section>

  <section id="settingsPage" class="page">
    <h2>Настройки</h2>

    <label>Язык</label>
    <select id="languageSelect">
      <option value="ru">Русский</option>
      <option value="tg">Тоҷикӣ</option>
      <option value="uz">O‘zbekcha</option>
      <option value="en">English</option>
    </select>

    <label>Размер текста</label>
    <select id="fontSelect">
      <option value="medium">Средний</option>
      <option value="large">Крупный</option>
    </select>

    <label>Тема</label>
    <select id="themeSelect">
      <option value="light">Светлая</option>
      <option value="dark">Тёмная</option>
      <option value="auto">Автоматически</option>
    </select>

    <h3>Уведомления</h3>
    <div id="notificationSettings"></div>

    <h3>Аккаунт и безопасность</h3>
    <div id="accountSettings"></div>

    <h3>Помощь и информация</h3>
    <div id="helpSettings"></div>
  </section>
</main>

<nav class="bottom-nav">
  <button data-page="homePage">⌂<span>Главная</span></button>
  <button data-page="shopsPage">▤<span>Магазины</span></button>
  <button data-page="cartPage">🛒<span>Корзина</span></button>
  <button data-page="ordersPage">▣<span>Заказы</span></button>
  <button data-page="profilePage">♙<span>Профиль</span></button>
</nav>

<script src="script.js"></script>
</body>
</html>
