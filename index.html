
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#16843a">
<meta name="description" content="Товары, магазины и доставка">
<title>Главная</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<header class="topbar">
  <div class="brand-icon"><span>✓</span></div>
  <div class="top-actions">
    <button id="searchOpen" aria-label="Поиск">⌕</button>
    <button data-open="messagesPage" aria-label="Сообщения">✉</button>
    <button data-open="settingsPage" aria-label="Настройки">⋮</button>
  </div>
</header>

<main>
<section id="homePage" class="page active">
  <div class="welcome">
    <h2 data-i18n="welcome">Добро пожаловать</h2>
    <p data-i18n="welcomeText">Выбирайте товары и оформляйте заказ</p>
  </div>

  <div id="searchBox" class="search-box hidden">
    <input id="searchInput" placeholder="Поиск товаров">
  </div>

  <div class="section-heading">
    <h3 data-i18n="ownProducts">Наши товары</h3>
  </div>
  <div id="ownProducts" class="product-grid"></div>

  <section class="partners">
    <div class="section-heading">
      <h3 data-i18n="partnerShops">Магазины-партнёры</h3>
      <button data-open="shopsPage" data-i18n="allShops">Все магазины →</button>
    </div>
    <div class="ticker-window">
      <div id="shopTicker" class="ticker-track"></div>
    </div>
  </section>
</section>

<section id="shopsPage" class="page">
  <h2 data-i18n="shops">Магазины</h2>
  <div id="shopsList" class="shops-list"></div>
</section>

<section id="shopDetailPage" class="page">
  <button class="back-button" data-open="shopsPage">← Назад</button>
  <div id="shopDetail"></div>
  <div id="shopProducts" class="product-grid"></div>
</section>

<section id="cartPage" class="page">
  <h2 data-i18n="cart">Корзина</h2>
  <div id="cartItems"></div>
  <div id="cartTotal"></div>
  <button id="checkoutButton" class="primary-button" data-i18n="checkout">Оформить заказ</button>
</section>

<section id="ordersPage" class="page">
  <h2 data-i18n="orders">Мои заказы</h2>
  <div id="ordersList"></div>
</section>

<section id="messagesPage" class="page">
  <h2 data-i18n="messages">Сообщения</h2>
  <div id="messagesList"></div>
  <div class="message-compose">
    <input id="messageInput" placeholder="Ваше сообщение">
    <button id="sendMessage">➤</button>
  </div>
</section>

<section id="profilePage" class="page">
  <h2 data-i18n="profile">Мой аккаунт</h2>
  <div id="profileContent"></div>
</section>

<section id="settingsPage" class="page">
  <h2 data-i18n="settings">Настройки</h2>

  <div class="setting-group">
    <label data-i18n="language">Язык</label>
    <select id="languageSelect">
      <option value="ru">Русский</option>
      <option value="tg">Тоҷикӣ</option>
      <option value="uz">O‘zbekcha</option>
      <option value="en">English</option>
    </select>
  </div>

  <div class="setting-group">
    <label data-i18n="fontSize">Размер текста</label>
    <select id="fontSelect">
      <option value="medium">Средний</option>
      <option value="large">Крупный</option>
    </select>
  </div>

  <div class="setting-group">
    <label data-i18n="theme">Тема</label>
    <select id="themeSelect">
      <option value="light">Светлая</option>
      <option value="dark">Тёмная</option>
      <option value="auto">Автоматически</option>
    </select>
  </div>

  <div class="setting-group">
    <h3 data-i18n="account">Аккаунт</h3>
    <div id="accountSettings"></div>
  </div>

  <div class="setting-group">
    <h3 data-i18n="help">Помощь и информация</h3>
    <p>WhatsApp: +992000001606</p>
    <p>Alif — скоро</p>
    <p>Версия 1.0</p>
  </div>
</section>
</main>

<nav class="bottom-nav">
  <button data-open="homePage">⌂<span data-i18n="home">Главная</span></button>
  <button data-open="shopsPage">▤<span data-i18n="shops">Магазины</span></button>
  <button data-open="cartPage">🛒<span data-i18n="cart">Корзина</span></button>
  <button data-open="ordersPage">▣<span data-i18n="orders">Заказы</span></button>
  <button data-open="profilePage">♙<span data-i18n="profile">Профиль</span></button>
</nav>

<script src="script.js"></script>
</body>
</html>
