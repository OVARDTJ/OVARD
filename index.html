
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#16843a">
  <title>OVARD — Фархор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <a class="logo" href="#" onclick="showPage('home')">Ovard</a>
  <span class="location">📍 Фархор</span>
  <button class="menu" onclick="showPage('settings')">⋮</button>
</header>

<main>

<section id="home" class="page">
  <div class="hero">
    <h1>Покупать в Фархоре стало проще</h1>
    <p>Товары и доставка от OVARD</p>
  </div>

  <h2>Товары OVARD</h2>
  <div id="products" class="grid"></div>
</section>

<section id="shops" class="page hidden">
  <h1>Магазины</h1>
  <div id="shops"></div>
</section>

<section id="orders" class="page hidden">
  <h1>Мои заказы</h1>
  <div id="ordersList"></div>
</section>

<section id="profile" class="page hidden">
  <h1>Профиль</h1>
  <input id="customerName" placeholder="Ваше имя">
  <input id="customerPhone" placeholder="Номер телефона">
  <input id="customerAddress" placeholder="Адрес в Фархоре">
  <button onclick="saveProfile()">Сохранить</button>
</section>

<section id="cart" class="page hidden">
  <h1>Корзина</h1>
  <div id="cartItems"></div>
</section>

<section id="settings" class="page hidden">
  <h1>Настройки</h1>
  <label>Язык</label>
  <select>
    <option>Русский</option>
    <option>Тоҷикӣ</option>
    <option>English</option>
  </select>

  <label>Оформление</label>
  <select onchange="changeTheme(this.value)">
    <option value="light">Светлая тема</option>
    <option value="dark">Тёмная тема</option>
  </select>

  <p>Регион: Фархор</p>
  <p>Доставка: только Фархор</p>
  <button onclick="showPage('admin')">Управление OVARD</button>
</section>

<section id="admin" class="page hidden">
  <h1>Управление OVARD</h1>
  <h3>Добавить товар</h3>
  <input id="pName" placeholder="Название товара">
  <input id="pPrice" type="number" placeholder="Цена">
  <select id="pUnit" onchange="toggleOther(this.value)">
    <option value="кг">Килограмм</option>
    <option value="шт.">Штука</option>
    <option value="мешок">Мешок</option>
    <option value="упаковка">Упаковка</option>
    <option value="литр">Литр</option>
    <option value="метр">Метр</option>
    <option value="другое">Другое — вручную</option>
  </select>
  <input id="otherUnit" class="hidden" placeholder="Напишите любую единицу">
  <button onclick="addProduct()">Добавить товар</button>

  <h3>Добавить магазин</h3>
  <input id="shopName" placeholder="Название магазина">
  <input id="shopDescription" placeholder="Описание магазина">
  <button onclick="addShop()">Добавить магазин</button>
</section>

</main>

<nav class="bottom">
  <button onclick="showPage('home')">⌂<small>Главная</small></button>
  <button onclick="showPage('shops')">▦<small>Магазины</small></button>
  <button onclick="showPage('cart')">🛒<small>Корзина</small></button>
  <button onclick="showPage('orders')">▤<small>Заказы</small></button>
  <button onclick="showPage('profile')">♙<small>Профиль</small></button>
</nav>

<script src="script.js"></script>
</body>
</html>
